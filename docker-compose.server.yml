# Docker Compose 2.24.4+ required for !override.
# Use together with docker-compose.yml, never alone.
services:
  backend:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://107.108.42.60:5050}
  worker:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://107.108.42.60:5050}
  seed:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
  frontend:
    ports: !override
      - "${HTTPS_PORT:-5050}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
