# Port 3000 is container-internal and serves only the health probe.
server {
    listen 3000;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        return 413 '{"success":false,"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request exceeds upload limit"}}';
    }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
