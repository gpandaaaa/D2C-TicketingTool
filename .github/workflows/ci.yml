name: Service Desk checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: helpdesk_test
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: ci-isolated-database-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_runner -d helpdesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: pytest
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test_runner:ci-isolated-database-only@localhost:5432/helpdesk_test
      - run: pip-audit -r backend/requirements.txt
