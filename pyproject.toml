[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".runtime", ".python", ".cache", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# SQLAlchemy overloads equality to build SQL predicates.
ignore = ["E711", "E712"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
