<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" rx="24" fill="#f2f6fc"/><style>text{font-family:Arial,sans-serif}</style><text x="40" y="52" font-size="28" font-weight="bold" fill="#10264c">Verify before handing over</text><text x="40" y="86" font-size="17" fill="#53647c">Record actual results on the target server — these are acceptance steps</text><rect x="40" y="115" width="1020" height="90" rx="15" fill="white" stroke="#d3dfef"/><circle cx="78" cy="159" r="22" fill="#174bc7"/><text x="78" y="166" text-anchor="middle" fill="white" font-size="19">1</text><text x="120" y="149" font-size="21" font-weight="bold" fill="#10264c">Infrastructure</text><text x="120" y="180" font-size="17" fill="#53647c">Healthy containers → trusted HTTPS → successful login</text><rect x="40" y="225" width="1020" height="90" rx="15" fill="white" stroke="#d3dfef"/><circle cx="78" cy="269" r="22" fill="#174bc7"/><text x="78" y="276" text-anchor="middle" fill="white" font-size="19">2</text><text x="120" y="259" font-size="21" font-weight="bold" fill="#10264c">Administrator</text><text x="120" y="290" font-size="17" fill="#53647c">Configure categories, engineer skills, capacity, assignment and SLA policies</text><rect x="40" y="335" width="1020" height="90" rx="15" fill="white" stroke="#d3dfef"/><circle cx="78" cy="379" r="22" fill="#174bc7"/><text x="78" y="386" text-anchor="middle" fill="white" font-size="19">3</text><text x="120" y="369" font-size="21" font-weight="bold" fill="#10264c">Requester → engineer → requester</text><text x="120" y="400" font-size="17" fill="#53647c">Create → assign → notify → work → resolve → close</text><rect x="40" y="445" width="1020" height="90" rx="15" fill="white" stroke="#d3dfef"/><circle cx="78" cy="489" r="22" fill="#174bc7"/><text x="78" y="496" text-anchor="middle" fill="white" font-size="19">4</text><text x="120" y="479" font-size="21" font-weight="bold" fill="#10264c">Handover</text><text x="120" y="510" font-size="17" fill="#53647c">Verify audit and permissions → restart host → confirm persistence → test backups</text></svg>