<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" rx="24" fill="#f2f6fc"/><style>text{font-family:Arial,sans-serif}</style><text x="40" y="52" font-size="28" font-weight="bold" fill="#10264c">Before opening the site</text><text x="40" y="86" font-size="17" fill="#53647c">Connectivity and identity checks for the Ubuntu host</text><rect x="40" y="115" width="1020" height="90" rx="15" fill="white" stroke="#d3dfef"/><circle cx="78" cy="159" r="22" fill="#174bc7"/><text x="78" y="166" text-anchor="middle" fill="white" font-size="19">1</text><text x="120" y="149" font-size="21" font-weight="bold" fill="#10264c">Address and port</text><text x="120" y="180" font-size="17" fill="#53647c">107.108.42.60 belongs to Ubuntu · TCP 5050 is available</text><rect x="40" y="225" width="1020" height="90" rx="15" fill="white" stroke="#d3dfef"/><circle cx="78" cy="269" r="22" fill="#174bc7"/><text x="78" y="276" text-anchor="middle" fill="white" font-size="19">2</text><text x="120" y="259" font-size="21" font-weight="bold" fill="#10264c">Network access</text><text x="120" y="290" font-size="17" fill="#53647c">Allow approved employee networks to 5050 through infrastructure ACLs</text><rect x="40" y="335" width="1020" height="90" rx="15" fill="white" stroke="#d3dfef"/><circle cx="78" cy="379" r="22" fill="#174bc7"/><text x="78" y="386" text-anchor="middle" fill="white" font-size="19">3</text><text x="120" y="369" font-size="21" font-weight="bold" fill="#10264c">Certificate identity</text><text x="120" y="400" font-size="17" fill="#53647c">SAN must contain IP:107.108.42.60 · no port number in the certificate SAN</text><rect x="40" y="445" width="1020" height="90" rx="15" fill="white" stroke="#d3dfef"/><circle cx="78" cy="489" r="22" fill="#174bc7"/><text x="78" y="496" text-anchor="middle" fill="white" font-size="19">4</text><text x="120" y="479" font-size="21" font-weight="bold" fill="#10264c">Client trust</text><text x="120" y="510" font-size="17" fill="#53647c">Install organizational CA trust · verify HTTPS without certificate warnings</text></svg>